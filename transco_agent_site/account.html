<!--
  Transco Cargo Sydney — "My Transco" customer account page.

  A customer's own space around the Transco Agent: sign in with a
  WhatsApp code (no password), then see bookings, shipments (with their
  own BL), declaration status and profile — and make a booking. The
  Agent chat itself stays on the homepage (/#agent); this page links
  back to it rather than duplicating it.

  Everything shown comes from the live backend (/api/portal/*) for the
  signed-in customer only. Nothing here is sample data: an empty account
  shows friendly empty states, and a failed request shows a retry, never
  a guess. Customer identity lives only in the signed token the backend
  issued — this page never tells the backend who the customer is.

  Self-contained like the rest of the site: no build step, no framework,
  no dependencies beyond Google Fonts. Routes are hash-based
  (#/home, #/bookings, #/bookings/<id>, #/book, #/shipments,
  #/shipments/<id>, #/documents, #/profile).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Transco — Transco Cargo Sydney</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #182233;
    --navy-soft: #2a3648;
    --cream: #f6f4ef;
    --ink: #1c2430;
    --muted: #5f6873;
    --sl-teal: #12a189;
    --sl-teal-deep: #0c7d6b;
    --in-orange: #f0762e;
    --line: #e3e0d8;
    --card: #ffffff;
    --pending-bg: #fdf3e1; --pending-ink: #7a4f00;
    --active-bg: #e3f4f0;  --active-ink: #0a6657;
    --done-bg: #e5f3e8;    --done-ink: #1f6b33;
    --muted-bg: #eef0f2;   --muted-ink: #4f5864;
    --danger: #b3261e;
    --focus: #1a73e8;
    --tabbar-h: 64px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', 'Noto Sans Sinhala', 'Noto Sans Tamil', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
    line-height: 1.5;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background: url('https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=1600,fit=crop/A3Q7bo0gbPUjX8Jp/cardboard-box-retail-counter-mP4MjyGQWZtba40l.jpg') center/cover;
    filter: brightness(0.7) saturate(0.85) blur(4px);
  }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: rgba(246,244,239,0.9); }
  h1, h2, h3 { font-weight: 800; letter-spacing: -0.02em; color: var(--navy); }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* ---------- Top nav (same as the rest of the site) ---------- */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 5vw, 64px); background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 500; }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; text-decoration: none; color: #fff; }
  .nav-brand-mark { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
  .nav-right { display: flex; align-items: center; gap: clamp(20px, 3vw, 32px); }
  .nav-links { display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 500; }
  .nav-links a { text-decoration: none; color: rgba(255,255,255,0.82); }
  .nav-links a:hover { opacity: 0.75; }
  .nav-links a.nav-link-primary { color: #fff; font-weight: 700; padding: 7px 14px; border-radius: 999px; background: rgba(18,161,137,0.22); border: 1px solid rgba(18,161,137,0.5); }
  .nav-links a.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 4px; }
  .nav-toggle { display: none; background: none; border: none; color: #fff; padding: 6px; cursor: pointer; flex-shrink: 0; }
  .nav-toggle svg { display: block; width: 24px; height: 24px; }
  .nav-mobile-panel { display: none; flex-direction: column; gap: 2px; background: var(--navy-soft); padding: 6px clamp(16px, 5vw, 64px) 20px; position: sticky; top: 62px; z-index: 499; }
  .nav-mobile-panel.open { display: flex; }
  .nav-mobile-panel a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 15.5px; font-weight: 500; padding: 13px 2px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .nav-mobile-panel a.active { color: var(--sl-teal); }
  @media (max-width: 1040px) { .nav-right { display: none; } .nav-toggle { display: block; } .nav-brand { font-size: 17px; } }

  /* ---------- Portal shell ---------- */
  .shell { max-width: 820px; margin: 0 auto; padding: 20px 16px 40px; }
  @media (min-width: 700px) { .shell { padding: 28px 24px 56px; } }
  body.has-tabbar .shell { padding-bottom: calc(var(--tabbar-h) + 48px + env(safe-area-inset-bottom)); }
  @media (min-width: 781px) { body.has-tabbar .shell { padding-bottom: 56px; } }

  .portal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .portal-head .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sl-teal-deep); }
  .lang-switch { display: inline-flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang-switch button { border: none; background: transparent; padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; min-height: 32px; }
  .lang-switch button[aria-pressed="true"] { background: var(--navy); color: #fff; }

  /* Desktop tabs */
  .tabs { display: none; gap: 6px; margin-bottom: 20px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 5px; }
  .tabs a { flex: 1; text-align: center; text-decoration: none; padding: 10px 8px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .tabs a:hover { background: var(--cream); color: var(--navy); }
  .tabs a[aria-current="page"] { background: var(--navy); color: #fff; }
  .tabs a.ai { color: var(--sl-teal-deep); }
  @media (min-width: 781px) { body.has-tabbar .tabs { display: flex; } }

  /* Mobile bottom tab bar */
  /* Phones: a floating dark bar that stands out from the page — white icons,
     the current page in teal, and a raised teal Ask AI button in the middle. */
  .tabbar { display: none; position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 600; background: var(--navy); border-radius: 22px; padding: 6px; gap: 2px; box-shadow: 0 12px 30px rgba(24,34,51,0.35), 0 0 0 1px rgba(255,255,255,0.06) inset; }
  body.has-tabbar .tabbar { display: flex; }
  @media (min-width: 781px) { body.has-tabbar .tabbar { display: none; } }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: rgba(255,255,255,0.72); font-size: 11.5px; font-weight: 600; min-height: 54px; border-radius: 16px; transition: background 0.15s ease, color 0.15s ease; }
  .tabbar a svg { width: 23px; height: 23px; }
  .tabbar a[aria-current="page"] { color: #fff; background: var(--sl-teal-deep, #0c7d6b); }
  .tabbar a:active { background: rgba(255,255,255,0.12); }
  .tabbar a.ai { color: #fff; }
  .tabbar a.ai .ai-bubble { width: 50px; height: 50px; border-radius: 50%; background: var(--sl-teal-deep, #0c7d6b); border: 3px solid var(--navy); display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 8px 18px rgba(12,125,107,0.45); }
  .tabbar a.ai span.lbl { color: #fff; }

  /* ---------- Building blocks ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 1px 3px rgba(24,34,51,0.05); }
  @media (min-width: 700px) { .card { padding: 22px; } }
  .stack > * + * { margin-top: 14px; }
  .page-title { font-size: clamp(24px, 5vw, 30px); margin: 4px 0 6px; }
  .page-sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
  .section-title { font-size: 17px; margin: 26px 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: 12px; border: 1.5px solid var(--navy); background: var(--navy); color: #fff; font-weight: 700; font-size: 15.5px; text-decoration: none; cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease; }
  .btn:hover { box-shadow: 0 6px 16px rgba(24,34,51,0.18); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.55; cursor: default; box-shadow: none; }
  .btn.secondary { background: #fff; color: var(--navy); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--navy); padding-left: 8px; padding-right: 8px; }
  .btn.teal { background: var(--sl-teal-deep); border-color: var(--sl-teal-deep); }
  .btn.danger { background: #fff; color: var(--danger); border-color: rgba(179,38,30,0.4); }
  .btn.block { width: 100%; }
  .btn.small { min-height: 40px; padding: 8px 14px; font-size: 14px; }
  .link-btn { background: none; border: none; color: var(--sl-teal-deep); font-weight: 700; cursor: pointer; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; font-size: 15px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; line-height: 1.3; }
  .pill.pending { background: var(--pending-bg); color: var(--pending-ink); }
  .pill.active { background: var(--active-bg); color: var(--active-ink); }
  .pill.done { background: var(--done-bg); color: var(--done-ink); }
  .pill.muted { background: var(--muted-bg); color: var(--muted-ink); }
  .chip-code { display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em; color: var(--navy); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-variant-numeric: tabular-nums; }

  /* The customer's BL number — their main reference, shown big on Home. */
  .bl-card { background: var(--card); border: 2px solid var(--sl-teal-deep); border-radius: 18px; padding: 18px; margin: 0 0 18px; box-shadow: 0 4px 14px rgba(12,125,107,0.10); }
  .bl-card .lbl { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--sl-teal-deep); }
  .bl-card .num { font-size: clamp(30px, 8vw, 38px); font-weight: 800; letter-spacing: 0.01em; color: var(--navy); font-variant-numeric: tabular-nums; margin: 2px 0 6px; user-select: all; word-break: break-all; }
  .bl-card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .bl-card .meta b { color: var(--navy); }
  .bl-card .hint { font-size: 14px; color: var(--muted); margin: 10px 0 12px; }
  .bl-card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .bl-card .earlier { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .bl-card .earlier a { text-decoration: none; }

  .notice { border-radius: 14px; padding: 14px 16px; font-size: 15px; display: flex; gap: 12px; align-items: flex-start; }
  .notice.warn { background: var(--pending-bg); color: var(--pending-ink); border: 1px solid rgba(122,79,0,0.18); }
  .notice.info { background: #eef3fb; color: #23406e; border: 1px solid rgba(35,64,110,0.15); }
  .notice.ok { background: var(--done-bg); color: var(--done-ink); border: 1px solid rgba(31,107,51,0.2); }
  .notice.err { background: #fdecea; color: var(--danger); border: 1px solid rgba(179,38,30,0.2); }
  .notice .ico { font-size: 18px; line-height: 1.3; flex-shrink: 0; }

  /* Items / list cards */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .item-card { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; transition: border-color 0.12s ease, box-shadow 0.12s ease; }
  a.item-card:hover { border-color: var(--sl-teal); box-shadow: 0 6px 16px rgba(24,34,51,0.07); }
  .item-card .kicker { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .item-card .title { font-size: 18px; font-weight: 800; color: var(--navy); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .item-card .lines { color: var(--ink); font-size: 15px; }
  .item-card .foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .item-card .go { color: var(--sl-teal-deep); font-weight: 700; font-size: 14px; white-space: nowrap; }

  /* Home */
  .hello { font-size: clamp(26px, 6vw, 34px); margin: 6px 0 4px; }
  .quick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .quick-grid a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; text-decoration: none; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 8px; min-height: 92px; font-weight: 700; font-size: 14px; color: var(--navy); }
  .quick-grid a:hover { border-color: var(--sl-teal); }
  .quick-grid .emoji { font-size: 24px; }
  @media (max-width: 360px) { .quick-grid { grid-template-columns: 1fr; } .quick-grid a { flex-direction: row; min-height: 56px; justify-content: flex-start; padding: 12px 16px; } }
  .recent-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 700px) { .recent-grid { grid-template-columns: 1fr 1fr; } }

  /* Timeline */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-bottom: 16px; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
  .timeline li:last-child::before { display: none; }
  .timeline li.done::before { background: var(--sl-teal); }
  .timeline .dot { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; border: 2px solid var(--line); background: #fff; color: var(--muted); position: relative; z-index: 1; }
  .timeline li.done .dot { background: var(--sl-teal-deep); border-color: var(--sl-teal-deep); color: #fff; }
  .timeline li.current .dot { border-color: var(--sl-teal-deep); color: var(--sl-teal-deep); }
  .timeline .lbl { padding-top: 3px; font-size: 15px; }
  .timeline li.done .lbl { font-weight: 600; }
  .timeline li.current .lbl { font-weight: 700; color: var(--navy); }
  .timeline li.todo .lbl { color: var(--muted); }
  .timeline li.attention .dot { border-color: #c98a00; background: var(--pending-bg); color: var(--pending-ink); }
  .timeline li.attention .lbl { color: var(--pending-ink); font-weight: 700; }

  /* Key/value */
  .kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 10px 14px; margin: 0; }
  .kv dt { color: var(--muted); font-size: 14px; }
  .kv dd { margin: 0; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  @media (max-width: 380px) { .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 10px; } }

  /* Forms */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field + .field { margin-top: 14px; }
  .field label, .field .label { font-weight: 700; font-size: 15px; color: var(--navy); }
  .field .help { font-size: 13.5px; color: var(--muted); }
  .input, select.input, textarea.input { width: 100%; min-height: 48px; padding: 11px 14px; border: 1.5px solid #cfd4d8; border-radius: 12px; background: #fff; color: var(--ink); font-size: 16px; }
  textarea.input { min-height: 90px; resize: vertical; }
  .input:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(26,115,232,0.25); }
  .input[aria-invalid="true"] { border-color: var(--danger); }
  .field-error { color: var(--danger); font-size: 14px; font-weight: 600; }
  .phone-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; }
  @media (max-width: 340px) { .phone-row { grid-template-columns: 1fr; } }
  .code-input { font-size: 26px; letter-spacing: 0.4em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-2 .field + .field { margin-top: 0; }
  @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
  .form-section { padding-top: 6px; }
  .form-section + .form-section { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 20px; }
  .form-section h3 { font-size: 16px; margin: 0 0 12px; }

  /* Choice tiles (radio) */
  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choices.sizes { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 520px) { .choices.sizes { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .choices.two { grid-template-columns: 1fr; } }
  .profile-head { display: flex; align-items: center; gap: 14px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--sl-teal-deep); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; flex-shrink: 0; }
  .card.menu { padding: 4px 0; }
  .fold + .fold, .fold + .menu-row { border-top: 1px solid var(--line); }
  .fold > summary, .menu-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 60px; cursor: pointer; list-style: none; text-decoration: none; color: inherit; }
  .fold > summary::-webkit-details-marker { display: none; }
  .menu-ico { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
  .menu-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .menu-title { font-weight: 700; color: var(--navy); font-size: 16px; }
  .menu-hint { font-size: 13.5px; color: var(--muted); }
  .menu-hint.warn { color: #9a6200; font-weight: 600; }
  .menu-chev { font-size: 22px; color: var(--muted); transition: transform 0.15s ease; }
  .fold[open] > summary .menu-chev { transform: rotate(90deg); }
  .fold[open] > summary { background: rgba(18,161,137,0.06); }
  .fold-body { padding: 4px 16px 18px; }
  .person-card { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; }
  .person-main { min-width: 0; overflow-wrap: anywhere; }
  .person-name { font-weight: 700; color: var(--navy); font-size: 15.5px; margin-bottom: 2px; }
  .person-card .btn.small { flex-shrink: 0; min-height: 40px; }
  .person-form { border: 2px solid var(--sl-teal-deep); border-radius: 14px; padding: 14px; background: #fff; }
  .add-person { border-style: dashed; min-height: 48px; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-chip { font: inherit; font-size: 14.5px; font-weight: 600; color: var(--navy); background: #fff; border: 1.5px solid #cfd4d8; border-radius: 999px; padding: 9px 14px; cursor: pointer; min-height: 42px; }
  .cat-chip[aria-pressed="true"] { background: var(--sl-teal-deep); border-color: var(--sl-teal-deep); color: #fff; }
  .cat-chip[aria-pressed="true"]::before { content: "✓ "; }
  .notice.ins-rec { display: block; background: #fff4d6; border: 2px solid #e0a100; color: #5a3b00; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choice label { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 1.5px solid #cfd4d8; border-radius: 14px; background: #fff; cursor: pointer; min-height: 56px; justify-content: center; }
  .choice label .t { font-weight: 700; color: var(--navy); font-size: 15.5px; }
  .choice label .d { font-size: 13.5px; color: var(--muted); }
  .choice input:checked + label { border-color: var(--sl-teal-deep); background: #f1faf8; box-shadow: inset 0 0 0 1px var(--sl-teal-deep); }
  .choice input:checked + label .t::after { content: "  ✓"; color: var(--sl-teal-deep); }
  .choice input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choice input:disabled + label { opacity: 0.5; cursor: not-allowed; background: #f4f4f4; }

  /* Quantity rows */

  function sendToAgent(payload, displayText) {

    fetch(API_ORIGIN + "/api/web-chat", { method: "POST", headers: headers, body: JSON.stringify(body) })

  // ---------------------------------------------------------------
  // New booking (guided, with review before anything is created)
  // ---------------------------------------------------------------
  var draft = null;
  var bookingOptions = null;
  var TOTAL_STEPS = 6;
  // Steps: 1 where/how · 2 items · 3 sender · 4 receiver + delivery ·
  // 5 drop-off · 6 review. Steps 3–4 are the declaration: they replace
  // the external declaration form for online bookings.

  function blankPerson() { return { fullName: "", address: "", town: "", mobile: "", email: "", idNumber: "", homePhone: "" }; }
  // What's inside the boxes — the UPB Gift Cargo Declaration categories.
  // Clothes and toys carry new/used in the category itself.
  var CONTENT_CATS = ["food", "new_clothing", "used_clothing", "new_toys", "used_toys", "medicine", "electrical", "electronics", "others"];
  function catLabel(key) { return (STRINGS[lang].cats || STRINGS.en.cats)[key] || key; }
  // A booking saved before categories (free-text rows) shows as "Others".
  function contentRow(c) {
    var cat = CONTENT_CATS.indexOf(c.category) !== -1 ? c.category : "others";
    var desc = cat === "others" ? (c.description || "") + (c.category ? "" : c.condition === "used" ? " (used)" : "") : "";
    return { category: cat, description: desc, qty: String(c.qty || 1), value: c.value === null || c.value === undefined ? "" : String(c.value) };
  }
  function contentsPayload() {
    return draft.contents.map(function (c) {
      var out = { category: c.category, qty: Number(c.qty) };
      if (c.category === "others") out.description = c.description.trim();
      if (String(c.value).trim() !== "") out.value = Number(c.value);
      return out;
    });
  }
  function contentsBad() {
    if (!draft.contents.length) return true;
    return draft.contents.some(function (c) {
      var q = Number(c.qty), v = String(c.value || "").trim();

  function checkPerson(p, withId, senderId) {
    if ((p.fullName || "").trim().length < 2) return { msg: t("vName"), key: "fullName" };
    // The sender (in Australia): street / suburb / state / postcode and an 04 mobile.
    if (!withId) {
      if ((p.street || "").trim().length < 3) return { msg: t("vStreet"), key: "street" };
      if ((p.suburb || "").trim().length < 2) return { msg: t("vSuburb"), key: "suburb" };

      if (!/^\d{4}$/.test((p.postcode || "").trim())) return { msg: t("vPostcode"), key: "postcode" };

    if (withId && !/^[A-Za-z0-9•]{5,20}$/.test((p.idNumber || "").replace(/\s/g, ""))) return { msg: t("vId"), key: "idNumber" };

  // Australian address ⇄ the one-line address the declaration stores:
  // "18 Sorrell St, Parramatta NSW 2150".
  var AU_ADDRESS_RE = /^(.+?),\s*([^,]+?)\s+(NSW|VIC|QLD|WA|SA|TAS|ACT|NT)\s+(\d{4})$/i;

            h("span", { class: "menu-ico", "aria-hidden": "true", text: "📋" }),
            h("span", { class: "menu-text" }, h("span", { class: "menu-title", text: t("documentsTitle") })),
            h("span", { class: "menu-chev", "aria-hidden": "true", text: "›" }))),
        h("div", { class: "stack", style: "margin-top:14px" },
          h("button", { class: "btn secondary block", type: "button", onclick: function () { signOutLocal(); go("#/signin"); }, text: t("signOut") })));
      var want = sub && document.getElementById("fold-" + sub);
      if (want) want.open = true;
    });
  }
  // Profile → "My senders" and "My receivers": saved people the booking
  // form offers, so nothing is typed twice. Phone-first: one card per
  // person, tap Edit to open its form in place; one form open at a time.
  function peopleSection(only) {
    var wrap = h("div", { "aria-live": "polite" }, h("div", { class: only ? "" : "card", style: only ? "" : "margin-top:14px" }, h("p", { class: "muted", style: "margin:0", text: t("loading") })));
    var people = null, editing = null; // editing: { kind, id|null, person }
    var countries = STRINGS[lang].countries || STRINGS.en.countries;

    function idLine(p) { return p.idNumber ? t("idShort") + " " + p.idNumber : null; }
    function personCard(kind, p, title) {
      var lines = [kind === "receivers" ? [p.town, countries[p.country] || ""].filter(Boolean).join(", ") : (p.address || ""), formatAuPhone(p.mobile), idLine(p)].filter(Boolean);
      return h("div", { class: "person-card" },
        h("div", { class: "person-main" },
          h("div", { class: "person-name", text: title || p.fullName }),
          lines.map(function (l) { return h("div", { class: "muted small", text: l }); })),
        p.id ? h("button", { class: "btn secondary small", type: "button", "aria-label": t("edit") + ": " + p.fullName, text: t("edit"),
          onclick: function () { open(kind, p); } }) : null);
    }
    function open(kind, p) {
      editing = { kind: kind, id: p ? p.id : null, person: Object.assign(blankPerson(), p || {}, { country: p ? p.country : (kind === "receivers" ? "sri_lanka" : null) }) };
      draw();
      var f = document.getElementById((kind === "senders" ? "s" : "r") + "-fullName");
      if (f) { f.focus({ preventScroll: true }); f.scrollIntoView({ block: "center", behavior: "smooth" }); }
    }
    function editor() {
      var kind = editing.kind, p = editing.person, isRec = kind === "receivers";
      var err = h("div", { role: "alert" });
      var save = h("button", { class: "btn teal block", type: "submit", text: t("savePerson") });
      function fail(msg, key) {
        err.replaceChildren(h("div", { class: "notice err", style: "margin-top:12px" }, h("span", { class: "ico", "aria-hidden": "true", text: "⚠" }), h("span", { text: msg })));
        var el = key && document.getElementById((isRec ? "r-" : "s-") + key);
        if (el) { el.setAttribute("aria-invalid", "true"); el.focus(); }
      }
      var form = h("form", { class: "person-form", novalidate: true, onsubmit: function (e) {
        e.preventDefault();
        var bad = checkPerson(p, isRec, isRec ? null : "optional");
        if (bad) { fail(bad.msg, bad.key); return; }
        save.disabled = true; save.textContent = t("saving");
        var body = personPayload(p, isRec);
        if (isRec) body.country = p.country;
        api(editing.id ? "PUT" : "POST", "/me/people/" + kind + (editing.id ? "/" + encodeURIComponent(editing.id) : ""), body).then(function (d) {
          people = d; editing = null; draw();
        }).catch(function (e2) { save.disabled = false; save.textContent = t("savePerson"); fail(e2.message, e2.field && String(e2.field).split(".").pop()); });
      } },
        h("div", { style: "font-weight:800;font-size:16px;margin-bottom:10px", text: editing.id ? t("edit") + " · " + p.fullName : (isRec ? t("addReceiver") : t("addSender")) }),
        isRec ? h("div", { class: "field" }, h("span", { class: "label", text: t("sendingTo") }),
          radioGroup("pc", Object.keys(countries).map(function (k) { return { value: k, title: countries[k] }; }), p.country, function (v) { p.country = v; }, "two")) : null,
        personFields(isRec ? "r" : "s", p, isRec, isRec ? null : "optional"),
        err,
        h("div", { class: "stack", style: "margin-top:16px" }, save,
          h("button", { class: "btn secondary block", type: "button", text: t("cancel"), onclick: function () { editing = null; draw(); } }),
          editing.id ? h("button", { class: "link-btn", type: "button", style: "color:var(--danger);align-self:center", text: t("removePerson"), onclick: function () {
            confirmDialog({ title: t("removePersonTitle", { name: p.fullName }), body: t("removePersonBody"), yes: t("removePerson"), no: t("back") }).then(function (ok) {
              if (!ok) return;
              api("DELETE", "/me/people/" + kind + "/" + encodeURIComponent(editing.id)).then(function (d) { people = d; editing = null; draw(); })
                .catch(function (e3) { fail(e3.message); });
            });
          } }) : null));
      return form;
    }
    function group(kind) {
      var isRec = kind === "receivers", list = people[kind] || [];
      var items = [];
      if (!isRec) items.push(people.me && people.me.fullName ? personCard(kind, people.me, "🙋 " + people.me.fullName + " · " + t("youDefault")) : null);
      list.forEach(function (p) { items.push(editing && editing.kind === kind && editing.id === p.id ? editor() : personCard(kind, p)); });
      if (!list.length) items.push(h("p", { class: "muted small", style: "margin:4px 0", text: isRec ? t("noReceiversYet") : t("noSendersYet") }));
      if (editing && editing.kind === kind && !editing.id) items.push(editor());
      else items.push(h("button", { class: "btn secondary block add-person", type: "button", text: "➕ " + (isRec ? t("addReceiver") : t("addSender")), onclick: function () { open(kind, null); } }));
      // On its own page the page title already says what this is.
      return h("div", { class: only ? "" : "card", style: only ? "" : "margin-top:14px" },
        only ? null : h("h3", { style: "font-size:17px;margin:0 0 4px", text: isRec ? t("receiversTitle") : t("sendersTitle") }),
        only ? null : h("p", { class: "muted small", style: "margin:0 0 12px", text: isRec ? t("receiversSub") : t("sendersSub") }),
        h("div", { class: "stack" }, items));
    }
    function draw() { wrap.replaceChildren.apply(wrap, (only ? [only] : ["senders", "receivers"]).map(group)); }
    api("GET", "/me/people").then(function (d) { people = d; draw(); })
      .catch(function (e) { wrap.replaceChildren(h("div", { class: "notice err", style: "margin-top:14px" }, h("span", { text: e.message }))); });
    return wrap;
  }

  // Profile → "Your data & privacy": download everything we hold, or ask
  // us to delete the account (staff action it; legal records are kept
  // until their retention period ends — see the Privacy Policy).
  function privacyCard(p, bare) {
    var status = h("div", { "aria-live": "polite" });
    function note(kind, text) { status.replaceChildren(h("div", { class: "notice " + kind, style: "margin-top:12px" }, h("span", { text: text }))); }
    var dl = h("button", { class: "btn secondary block", type: "button", text: "⬇️ " + t("downloadData") });
    dl.addEventListener("click", function () {
      dl.disabled = true;
      api("GET", "/me/export").then(function (data) {
        var url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
        var a = h("a", { href: url, download: "my-transco-data.json" });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }).catch(function (err) { note("err", err.message); }).finally(function () { dl.disabled = false; });
    });
    var body;
    if (p.deletionRequestedAt) {
      body = h("div", { class: "notice info", style: "margin-top:12px" }, h("span", { text: t("deleteRequested", { d: fmtDate(p.deletionRequestedAt, { day: "numeric", month: "long", year: "numeric" }) }) }));
    } else {
      var pw = p.hasPassword ? passwordInput("del-password", "current-password") : null;
      var del = h("button", { class: "btn danger block", type: "button", style: "margin-top:10px", text: t("deleteAccount") });
      del.addEventListener("click", function () {
        confirmDialog({ title: t("deleteTitle"), body: t("deleteBody"), yes: t("deleteYes"), no: t("back") }).then(function (ok) {
          if (!ok) return;
          del.disabled = true;
          api("POST", "/me/delete-request", pw ? { password: pw.input.value } : {}).then(function (r) {
            p.deletionRequestedAt = r.requestedAt;
            card.replaceWith(privacyCard(p, bare));
          }).catch(function (err) { note("err", err.message); del.disabled = false; });
        });
      });
      body = h("div", { style: "margin-top:14px;border-top:1px solid var(--line);padding-top:12px" },
        h("p", { class: "muted small", style: "margin:0 0 8px", text: t("deleteHelp") }),
        pw ? h("div", { class: "field" }, h("div", { class: "spread" }, h("label", { for: "del-password", text: t("currentPassword") }), pw.toggle), pw.input) : null,
        del);
    }
    var card = h(bare ? "div" : "div", { class: bare ? "" : "card", style: bare ? "" : "margin-top:14px" },
      bare ? null : h("h3", { style: "font-size:16px;margin:0 0 6px", text: t("privacyTitle") }),
      h("p", { class: "muted small", style: "margin:0 0 12px" }, t("privacySub") + " ", h("a", { href: "/privacy.html", target: "_blank", rel: "noopener", text: t("privacyPolicy") }), "."),
      dl, body, status);
    return card;
  }

  function fieldFromError(err) {
    // The backend names the field it rejected; map it onto the form.
    return err && err.field ? err.field : null;
  }
  function markError(f, msg) {
    f.el.setAttribute("aria-invalid", "true");
    f.el.setAttribute("aria-describedby", f.el.id + "-err");
    var box = document.getElementById(f.el.id + "-err");
    if (box) box.textContent = msg;
    f.el.focus();
  }

  // ---------------------------------------------------------------
  // Router
  // ---------------------------------------------------------------
  var currentRoute = "";
  var pendingNotice = null;

  function go(hash, opts) {
    pendingNotice = opts && opts.notice ? opts.notice : null;
    if (location.hash === hash) route(); else location.hash = hash;
  }

  function route() {
    var hash = location.hash || "#/home";
    currentRoute = hash + "|" + Date.now();
    var parts = hash.replace(/^#\/?/, "").split("/");
    var section = parts[0] || "home";

    // Just signed in for the first time — finish the one-question
    // welcome (their name) before anything else.
    if (token && authState.step === "name") {
      renderChrome(null);
      return viewSignIn();
    }

    if (!token) {
      renderChrome(null);
      var notice = pendingNotice; pendingNotice = null;
      if (section !== "signin" && section !== "") {
        // Remember where they were headed, e.g. a QR code straight to
        // #/book — after signing in they land there.
        session("transco_after_signin", hash);
      }
      return viewSignIn({ notice: notice });
    }
    if (section === "signin") { go("#/home"); return; }

    renderChrome(section === "book" ? "bookings" : section);
    window.scrollTo({ top: 0 });

    switch (section) {
      case "bookings": return parts[2] === "edit" ? viewBookingEdit(decodeURIComponent(parts[1])) : parts[1] ? viewBooking(decodeURIComponent(parts[1])) : viewBookings();
      case "book": return viewBook(parts[1], parts[2]);
      case "shipments": return parts[1] ? viewShipment(decodeURIComponent(parts[1])) : viewShipments();
      case "documents": return viewDocuments();
      case "profile": return viewProfile(parts[1]);
      case "verify": return viewVerify();
      default: return viewHome();
    }
  }

  // A saved destination (from before sign-in) wins over the default home.
  var baseNextAfterSignIn = nextAfterSignIn;
  nextAfterSignIn = function () {
    var saved = session("transco_after_signin");
    session("transco_after_signin", null);
    var next = new URLSearchParams(location.search).get("next");
    if (!next && saved && saved !== "#/signin") { go(saved); return; }
    baseNextAfterSignIn();
  };

  // Where this visitor came from (warehouse QR vs. the website), kept for
  // the first sign-in only — never used to create a second account.
  (function rememberSource() {
    var src = new URLSearchParams(location.search).get("src");
    if (src === "qr") session(SOURCE_KEY, "warehouse_qr");
    else if (!session(SOURCE_KEY)) session(SOURCE_KEY, document.referrer ? "website" : "direct");
  })();

  window.addEventListener("hashchange", route);
  renderLangSwitch();

  // Returning customer: use the language they saved on their profile.
  if (token) {
    api("GET", "/me").then(function (d) {
      profile = d.profile;
      if (!store(LANG_KEY) && STRINGS[d.profile.preferredLanguage] && d.profile.preferredLanguage !== lang) {
        lang = d.profile.preferredLanguage; renderLangSwitch(); route();
      }
    }).catch(function () {});
  }
  route();
})();
</script>

<script>
(function () {
  var toggle = document.getElementById('nav-toggle');
  var panel = document.getElementById('nav-mobile-panel');
  var icon = document.getElementById('nav-toggle-icon');
  if (!toggle || !panel) return;
  var OPEN_D = "M6 6l12 12M6 18L18 6";
  var CLOSED_D = "M4 6h16M4 12h16M4 18h16";
  function setOpen(open) {
    panel.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    if (icon) icon.setAttribute('d', open ? OPEN_D : CLOSED_D);
  }
  toggle.addEventListener('click', function () { setOpen(!panel.classList.contains('open')); });
  panel.querySelectorAll('a').forEach(function (link) { link.addEventListener('click', function () { setOpen(false); }); });
})();
</script>
