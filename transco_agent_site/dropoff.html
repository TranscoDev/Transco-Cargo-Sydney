<!--
  Transco Cargo Sydney — walk-in drop-off form (the QR code at the counter).

  A customer who arrives without a booking fills the Shipping Declaration
  here on their own phone, instead of the old outside form. It goes
  straight into the CRM (POST /api/public/dropoff) where staff check the
  boxes and finalise it; the customer gets their copy by email after that.

  Their details are remembered ONLY on their own phone (localStorage), so
  next time is one tap — nothing is looked up from the server by phone
  number, so nobody can see someone else's details by typing their number.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Drop-off form — Transco Cargo Sydney</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #182233;
    --ink: #1c2430;
    --muted: #5f6873;
    --line: #dedad1;
    --cream: #f6f4ef;
    --teal: #0c7d6b;
    --teal-soft: #e6f6f1;
    --red: #b42318;
    --red-soft: #fdecea;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cream); color: var(--ink); font-size: 16px; line-height: 1.45; }
  header { background: var(--navy); color: #fff; padding: max(12px, env(safe-area-inset-top)) 16px 12px; position: sticky; top: 0; z-index: 10; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; margin: 0 auto; }
  .brand { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
  .brand small { display: block; font-weight: 500; font-size: 12px; color: rgba(255,255,255,0.7); }
  .langs { display: flex; gap: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 3px; }
  .langs button { border: 0; background: transparent; color: rgba(255,255,255,0.8); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 9px; border-radius: 8px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: #fff; color: var(--navy); }
  .progress { max-width: 560px; margin: 10px auto 0; display: flex; gap: 4px; }
  .progress span { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.18); }
  .progress span.on { background: #5fd3bd; }

  main { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(110px + env(safe-area-inset-bottom)); }
  .step-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
  h1 { font-size: 23px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 6px; color: var(--navy); }
  .lead { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  h2 { font-size: 16px; margin: 22px 0 10px; color: var(--navy); }

  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choices.sizes { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 520px) { .choices.sizes { grid-template-columns: 1fr 1fr; } }
  .choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; min-height: 58px; }
  .choice .ic { font-size: 24px; line-height: 1; }
  .choice small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .choice[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-soft); }
  .choice:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #5fd3bd; outline-offset: 2px; }

  .box-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
  .box-row .name { font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--cream); font-size: 22px; font-weight: 600; color: var(--navy); cursor: pointer; }
  .stepper output { min-width: 28px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .box-row.has { border-color: var(--teal); }
  .box-detail { background: #fff; border: 1px solid var(--teal); border-radius: var(--radius); padding: 12px; margin: -4px 0 10px; }
  .box-detail .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .box-detail .field { margin-bottom: 10px; }
  .box-detail .field:last-child { margin-bottom: 0; }
  .dims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dims label { font-weight: 400; font-size: 13px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; }
  .field label .opt { font-weight: 400; color: var(--muted); }
  .field input, .field textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  .field textarea { min-height: 76px; resize: vertical; }
  .field .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .field.bad input, .field.bad textarea { border-color: var(--red); background: #fffafa; }

  .reuse { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--teal-soft); border: 1.5px solid #9ad8c9; color: var(--teal); border-radius: var(--radius); padding: 12px 14px; font: inherit; font-weight: 600; text-align: left; cursor: pointer; margin-bottom: 16px; }
  .reuse small { display: block; font-weight: 400; color: var(--ink); }

  .item { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 12px; margin-bottom: 8px; }
  .item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 24px; }
  .item-top button { border: 0; background: none; color: var(--red); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .item input { width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; }
  /* New/Used, how many and value on one row — keeps a long list short. */
  .item-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; align-items: end; }
  .known { background: #fff; border: 1.5px solid #9ad8c9; border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
  .known .row2 { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; margin: 10px 0; }
  .known select, .known input { width: 100%; font: inherit; font-size: 16px; padding: 11px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  .known .small-btn { width: 100%; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 700; background: var(--navy); color: #fff; cursor: pointer; }
  .known .small-btn[disabled] { opacity: 0.6; }
  .known .msg { font-size: 14px; margin-top: 8px; color: var(--muted); }
  .known .msg.bad { color: var(--red); font-weight: 600; }
  .signed { background: var(--teal-soft); border: 1.5px solid #9ad8c9; color: var(--teal); border-radius: var(--radius); padding: 12px 14px; font-weight: 600; margin-bottom: 16px; }
  .saved-list { display: grid; gap: 8px; margin-bottom: 16px; }
  .item-grid label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 4px; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; min-width: 0; }
  .seg button[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
  .item.bad { border-color: var(--red); }
  .add { width: 100%; border: 2px dashed #b9b4a8; background: transparent; border-radius: var(--radius); padding: 14px; font: inherit; font-weight: 700; color: var(--navy); cursor: pointer; }
  .total { display: flex; justify-content: space-between; font-weight: 700; margin-top: 12px; padding: 0 4px; }

  .note { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
  .note.info { background: var(--teal-soft); border-color: #9ad8c9; }
  .check { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; font-size: 15px; }
  .check input { width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--teal); flex-shrink: 0; }
  .check.bad { border-color: var(--red); }

  .sig-wrap { background: #fff; border: 1.5px dashed #b9b4a8; border-radius: var(--radius); position: relative; }
  .sig-wrap canvas { display: block; width: 100%; height: 160px; touch-action: none; cursor: crosshair; }
  .sig-wrap .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a6a093; pointer-events: none; font-size: 15px; }
  .sig-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .sig-actions button { border: 0; background: none; color: var(--navy); font: inherit; font-weight: 600; cursor: pointer; padding: 6px; }

  .error { background: var(--red-soft); color: var(--red); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 14px; margin: 0 0 14px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 10; }
  .bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 15px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; background: var(--teal); color: #fff; min-height: 54px; }
  .btn.back { flex: 0 0 auto; background: var(--cream); color: var(--navy); border: 1px solid var(--line); padding: 15px 18px; }
  .btn[disabled] { opacity: 0.6; cursor: default; }

  .done { text-align: center; padding-top: 24px; }
  .done .big { width: 76px; height: 76px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 40px; display: grid; place-items: center; margin: 0 auto 16px; }
  .done .code { display: inline-block; font-size: 28px; font-weight: 800; letter-spacing: 0.01em; background: #fff; border: 2px solid var(--teal); border-radius: 14px; padding: 10px 20px; margin: 14px 0; font-variant-numeric: tabular-nums; }
  .done .summary { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 16px; font-size: 14px; }
  .done .summary div { padding: 3px 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
  .done .summary b { color: var(--muted); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
<script src="/phone-format.js"></script>
</head>
<body>
<header>
  <div class="head-row">
    <div class="brand">Transco Cargo Sydney<small data-t="Drop-off form">Drop-off form</small></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="si">සිං</button>
      <button type="button" data-lang="ta">த</button>
    </div>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
</header>

<main id="main" aria-live="polite"></main>

<div class="bar" id="bar">
  <div class="bar-inner">
    <button type="button" class="btn back" id="back">←</button>
    <button type="button" class="btn" id="next"></button>
  </div>
</div>

<script>

  var API_ORIGIN = "https://transco-backend-production.up.railway.app";
  try {
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && localStorage.getItem("transco_dev_api_origin")) {
      API_ORIGIN = localStorage.getItem("transco_dev_api_origin");
    }

  var LANG_KEY = "transco_lang";
  var LAST_KEY = "transco_dropoff_last";
  var DRAFT_KEY = "transco_dropoff_draft";

      "Undeclared dangerous goods cost at least AUD 250 per item to remove, and airport security may also fine you.": "ප්‍රකාශ නොකළ අනතුරුදායක බඩු ඉවත් කිරීමට එක බඩුවකට අවම AUD 250ක් වැය වෙනවා, ගුවන්තොටුපොළ ආරක්ෂාවෙනුත් දඩ ගැසිය හැක.",
      "Please tick each line to confirm it is not in your boxes.": "කරුණාකර හැම පේළියක්ම tick කරන්න.",

    var html = "<h1>" + esc(t("Where are you sending?")) + '</h1><p class="lead">' + esc(t("Fill this while you wait — our staff will check your boxes with you.")) + "</p>";
    html += '<div class="choices two">' + options.countries.map(function (o) {
      return choice('data-country="' + o.key + '"', state.country === o.key, o.key === "india" ? "🇮🇳" : "🇱🇰", t(o.label));
    }).join("") + "</div>";
    if (c) {
      html += "<h2>" + esc(t("How is it going?")) + '</h2><div class="choices two">' + c.services.map(function (s) {
        return choice('data-service="' + s.key + '"', state.service === s.key, s.key === "air" ? "✈️" : "🚢", t(s.label));
      }).join("") + "</div>";
    }
    return html;
  }

  function renderBoxes() {
    var c = country();
    var html = "<h1>" + esc(t("Your boxes")) + '</h1><p class="lead">' + esc(t("Tap + for each box you brought today.")) + "</p>";
    html += c.itemTypes.map(function (it) {
      var n = state.boxes[it.key] || 0;
      return '<div class="box-row' + (n ? " has" : "") + '"><span class="name">' + esc(it.label) + "</span>" +
        '<span class="stepper"><button type="button" data-box="' + it.key + '" data-d="-1" aria-label="Fewer ' + esc(it.label) + '">−</button>' +
        "<output>" + n + '</output><button type="button" data-box="' + it.key + '" data-d="1" aria-label="More ' + esc(it.label) + '">+</button></span></div>' +
        (n && it.key === "tv" ? renderTvSizes(n) : "") + (n && it.key === "other" ? renderOddDims(n) : "");
    }).join("");
    html += "<h2>" + esc(t("At the destination")) + '</h2><div class="choices">' +
      choice('data-delivery="collect"', state.deliveryType === "collect", "🏭", t("Pickup from our warehouse"), t("The receiver collects the boxes.")) +
      choice('data-delivery="door"', state.deliveryType === "door", "🚚", t("Door delivery"), t("Delivered to the receiver's address (extra charge).")) +
      "</div>";
    return html;
  }

  // TV screen-size bands and their Sea Freight prices (the bot's TV price
  // list). "other" = 56–59" or over 75" — our team confirms that price.
  var TV_SIZES = [
    { key: "upto35", label: 'Up to 35"', price: 140 }, { key: "36to45", label: '36" – 45"', price: 220 },
    { key: "46to55", label: '46" – 55"', price: 300 }, { key: "60to65", label: '60" – 65"', price: 350 },
    { key: "66to75", label: '66" – 75"', price: 400 }, { key: "other", label: null, price: null }
  ];
  function validTvSize(v) { return TV_SIZES.some(function (s) { return s.key === v; }); }

  // Under the TV row: pick a screen size per TV (TV prices go by size).
  function renderTvSizes(n) {
    // Prices are Sri Lanka Sea Freight; Air Freight goes by weight.
    var showPrice = state.country === "sri_lanka" && state.service === "sea";
    var html = '<div class="box-detail"><p class="hint">' + esc(t("TV prices go by screen size.")) + "</p>";
    for (var i = 0; i < n; i++) {
      html += '<div class="field' + (badFields["tv." + i] ? " bad" : "") + '"><label id="tv-l-' + i + '">' + esc(t("TV {n}: screen size", { n: i + 1 })) + "</label>" +
        '<div class="choices sizes" role="group" aria-labelledby="tv-l-' + i + '">' +
        TV_SIZES.map(function (s) {
          return s.key === "other"
            ? choice('data-tv="' + i + '" data-size="other"', state.tvSizes[i] === "other", "", t("Other size"), t("56\"–59\" or over 75\" — our team confirms the price"))
            : choice('data-tv="' + i + '" data-size="' + s.key + '"', state.tvSizes[i] === s.key, "", s.label, showPrice ? "$" + s.price : "");
        }).join("") + "</div></div>";
    }
    return html + "</div>";
  }

  // Under the odd-size row: length / width / height (cm) per item.
  function renderOddDims(n) {
    var html = '<div class="box-detail"><p class="hint">' + esc(t("Anything that isn't one of our standard boxes. Please measure it — it's priced by size.")) + "</p>";
    var labels = { l: "Length", w: "Width", h: "Height" };
    for (var i = 0; i < n; i++) {
      var d = state.oddDims[i] || {};
      html += '<div class="field' + (badFields["odd." + i] ? " bad" : "") + '"><label>' + esc(t("Odd-size item {n} (cm)", { n: i + 1 })) + '</label><div class="dims">' +
        ["l", "w", "h"].map(function (k) {
          return '<div><label for="odd-' + i + "-" + k + '">' + esc(t(labels[k])) + "</label>" +
            '<input id="odd-' + i + "-" + k + '" data-odd="' + i + '" data-dim="' + k + '" type="number" inputmode="decimal" min="1" max="500" step="any" value="' + esc(d[k] || "") + '" /></div>';
        }).join("") + "</div></div>";
    }
    return html + "</div>";
  }

  function field(group, key, label, opts) {
    opts = opts || {};
    var value = group === "_sign" ? state.signedName : state[group][key];
    var id = group + "-" + key;
    var bad = badFields[group + "." + key];
    var input = opts.multiline
      ? '<textarea id="' + id + '" data-group="' + group + '" data-key="' + key + '" autocomplete="' + (opts.ac || "off") + '">' + esc(value) + "</textarea>"
      : '<input id="' + id + '" data-group="' + group + '" data-key="' + key + '" value="' + esc(value) + '" type="' + (opts.type || "text") + '" inputmode="' + (opts.mode || "text") + '" autocomplete="' + (opts.ac || "off") + '"' + (opts.caps ? ' autocapitalize="characters"' : "") + " />";
    return '<div class="field' + (bad ? " bad" : "") + '"><label for="' + id + '">' + esc(t(label)) + (opts.optional ? ' <span class="opt">(' + esc(t("optional")) + ")</span>" : "") + "</label>" + input +
      (opts.hint ? '<div class="hint">' + esc(t(opts.hint)) + "</div>" : "") + "</div>";
  }

  // "Been here before?" — a WhatsApp code to their own number signs them
  // in to My Transco on this phone and fills in their saved details.
  function renderKnown() {
    var saved = account.defaults && account.defaults.sender;
    if (account.signedIn) {
      var html = '<div class="signed">✓ ' + esc(t("Signed in to My Transco — your saved details are filled in.")) + "</div>";
      if (saved && saved.fullName && saved.fullName !== state.sender.fullName) {
        html += '<button type="button" class="reuse" id="use-saved"><span aria-hidden="true">↺</span><span>' + esc(t("Use my saved details")) + "<small>" + esc(saved.fullName) + "</small></span></button>";
      }
      return html;
    }
    if (!account.open) {
      return '<button type="button" class="reuse" id="known-open"><span aria-hidden="true">👋</span><span>' + esc(t("Been here before?")) +
        "<small>" + esc(t("Fill in my details with a WhatsApp code")) + "</small></span></button>";
    }
    var html2 = '<div class="known"><b>' + esc(t("Been here before?")) + "</b>" +
      '<div class="msg" style="margin-top:4px">' + esc(t("We'll send a code to your WhatsApp.")) + "</div>" +
      '<div class="row2"><select id="known-cc" aria-label="Country code">' +
      ["61", "94", "91"].map(function (c) { return '<option value="' + c + '"' + (account.cc === c ? " selected" : "") + ">+" + c + "</option>"; }).join("") +
      '</select><input id="known-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="04XX XXX XXX" value="' + esc(account.phone) + '" aria-label="' + esc(t("Mobile")) + '" /></div>';
    if (account.sent) {
      html2 += '<input id="known-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="' + esc(t("6-digit code")) + '" value="' + esc(account.code) + '" aria-label="' + esc(t("6-digit code")) + '" style="margin-bottom:10px" />' +
        '<button type="button" class="small-btn" id="known-verify"' + (account.busy ? " disabled" : "") + ">" + esc(t("Fill in my details")) + "</button>";
    } else {
      html2 += '<button type="button" class="small-btn" id="known-send"' + (account.busy ? " disabled" : "") + ">" + esc(t("Send code")) + "</button>";
    }
    if (account.msg) html2 += '<div class="msg' + (account.msgBad ? " bad" : "") + '">' + esc(account.msg) + "</div>";
    return html2 + "</div>";
  }

  function renderSender() {
    var html = "<h1>" + esc(t("Sender — you")) + '</h1><p class="lead">' + esc(t("As on your passport or NIC.")) + "</p>";
    html += renderKnown();
    if (!account.signedIn && last && last.sender && last.sender.fullName && last.sender.fullName !== state.sender.fullName) {
      html += '<button type="button" class="reuse" id="reuse-sender"><span aria-hidden="true">↺</span><span>' + esc(t("Use my details from last time")) + "<small>" + esc(last.sender.fullName) + "</small></span></button>";
    }
    html += field("sender", "fullName", "Full name (as on passport / NIC)", { ac: "name" });
    html += field("sender", "idNumber", "Passport or NIC number", { caps: true, optional: state.country !== "sri_lanka" });
    html += field("sender", "address", "Address", { multiline: true, ac: "street-address" });
    html += field("sender", "mobile", "Mobile", { type: "tel", mode: "tel", ac: "tel" });
    html += field("sender", "homePhone", "Home phone", { type: "tel", mode: "tel", optional: true });
    html += field("sender", "email", "Email", { type: "email", mode: "email", ac: "email" });
    return html;
  }

  function savedReceivers() {
    var list = (account.defaults && account.defaults.receivers) || [];
    return list.filter(function (r) { return !r.country || r.country === state.country; }).slice(0, 6);
  }

  function renderReceiver() {
    var html = "<h1>" + esc(t("Receiver")) + '</h1><p class="lead">' + esc(t("Who the boxes are for.")) + "</p>";
    var saved = savedReceivers();
    if (saved.length) {
      html += '<div class="saved-list" role="group" aria-label="' + esc(t("Your saved receivers")) + '"><b style="font-size:14px">' + esc(t("Your saved receivers")) + "</b>" +
        saved.map(function (r, i) {
          return choice('data-saved-receiver="' + i + '"', state.receiver.fullName === r.fullName && state.receiver.town === r.town, "", r.fullName, [r.town, r.address].filter(Boolean).join(" · "));
        }).join("") + "</div>";
    } else if (last && last.receiver && last.receiver.fullName && last.country === state.country && last.receiver.fullName !== state.receiver.fullName) {
      html += '<button type="button" class="reuse" id="reuse-receiver"><span aria-hidden="true">↺</span><span>' + esc(t("Same receiver as last time")) + "<small>" + esc(last.receiver.fullName + (last.receiver.town ? ", " + last.receiver.town : "")) + "</small></span></button>";
    }
    html += field("receiver", "fullName", "Full name (as on passport / NIC)");
    html += field("receiver", "idNumber", "Passport or NIC number", { caps: true });
    html += field("receiver", "address", "Address", { multiline: true });
    html += field("receiver", "town", "Town / city");
    html += field("receiver", "mobile", "Mobile", { type: "tel", mode: "tel" });
    html += field("receiver", "homePhone", "Home phone", { type: "tel", mode: "tel", optional: true });
    html += field("receiver", "email", "Email", { type: "email", mode: "email" });
    return html;
  }

  function renderContents() {
    var html = "<h1>" + esc(t("What's inside?")) + '</h1><p class="lead">' + esc(t("List everything in your boxes — Customs needs it.")) + "</p>";
    html += state.contents.map(function (c, i) {
      var bad = badFields["contents." + i];
      return '<div class="item' + (bad ? " bad" : "") + '"><div class="item-top"><span>' + esc(t("Item {n}", { n: i + 1 })) + "</span>" +
        (state.contents.length > 1 ? '<button type="button" data-remove="' + i + '">' + esc(t("Remove")) + "</button>" : "") + "</div>" +
        '<input data-item="' + i + '" data-k="description" value="' + esc(c.description) + '" placeholder="' + esc(t("e.g. Chocolate")) + '" aria-label="' + esc(t("Item {n}", { n: i + 1 })) + '" />' +
        '<div class="item-grid"><div class="seg" role="group" aria-label="' + esc(t("New")) + " / " + esc(t("Used")) + '"><button type="button" data-item="' + i + '" data-cond="new" aria-pressed="' + (c.condition === "new") + '">' + esc(t("New")) + "</button>" +
        '<button type="button" data-item="' + i + '" data-cond="used" aria-pressed="' + (c.condition === "used") + '">' + esc(t("Used")) + "</button></div>" +
        '<div><label for="q' + i + '">' + esc(t("How many")) + '</label><input id="q' + i + '" data-item="' + i + '" data-k="qty" value="' + esc(c.qty) + '" inputmode="numeric" /></div></div></div>';
    }).join("");
    html += '<button type="button" class="add" id="add-item">' + esc(t("+ Add another item")) + "</button>";
    return html;
  }

  function renderDg() {
    var dg = state.dg;
    var html = "<h2>✈️ " + esc(t("Air Freight safety check")) + '</h2><p class="lead" style="margin-bottom:10px">' + esc(t("Tick each line to confirm it is NOT in your boxes.")) + "</p>";
    DG_LINES.forEach(function (line, i) {
      html += '<label class="check' + (badFields["dg.no"] && !dg.no[i] ? " bad" : "") + '" style="margin-bottom:8px"><input type="checkbox" data-dgno="' + i + '"' + (dg.no[i] ? " checked" : "") + " /><span>" + esc(t(line)) + "</span></label>";
    });
    // A line left unticked means it may be in their boxes. That's allowed —
    // it's flagged for staff — but they confirm it on purpose here.
    var missing = DG_ITEMS.filter(function (_, i) { return !dg.no[i]; });
    if (missing.length) {
      html += '<div class="note" style="margin-top:6px;border-color:#f3c3bd;background:#fff6f5"><b>' +
        esc(t("These can't go by Air Freight. Our staff will check them with you at drop-off (they may need to go by Sea Freight or be taken out):")) +
        '</b><ul style="margin:6px 0 0;padding-left:18px">' + missing.map(function (m) { return "<li>" + esc(t(m)) + "</li>"; }).join("") + "</ul></div>" +
        '<label class="check' + (badFields["dg.ack"] ? " bad" : "") + '" style="margin-top:8px"><input type="checkbox" id="dg-ack"' + (dg.ack ? " checked" : "") + " /><span>" +
        esc(t("Yes, my boxes may contain the items I didn't tick.")) + "</span></label>";
    }
    function question(key, label, hint, withDetails) {
      var out = '<h2 style="font-size:15px;margin:18px 0 8px">' + esc(t(label)) + "</h2>" + (hint ? '<p class="lead" style="margin:-4px 0 8px;font-size:14px">' + esc(t(hint)) + "</p>" : "") +
        '<div class="choices two">' + choice('data-dgq="' + key + '" data-v="no"', dg[key] === false, "", t("No")) + choice('data-dgq="' + key + '" data-v="yes"', dg[key] === true, "", t("Yes")) + "</div>";
      if (withDetails && dg[key] === true) {
        out += '<div class="field' + (badFields["dg." + key + "Details"] ? " bad" : "") + '" style="margin-top:10px"><label for="dg-' + key + '">' + esc(t("Type of product and quantity")) + '</label><input id="dg-' + key + '" data-dgd="' + key + '" value="' + esc(dg[key + "Details"]) + '" /></div>';
      }
      return out;
    }
    html += question("medications", "Any medications?", "If yes, only personal medication with a prescription.", false);
    html += question("lithium", "Lithium batteries in any product?", "For example a phone, laptop, camera or power bank.", true);
    html += question("liquids", "Any liquids?", null, true);
    html += '<div class="note" style="margin-top:14px;border-color:#f3c3bd;background:#fff6f5">⚠️ ' + esc(t("Undeclared dangerous goods cost at least AUD 250 per item to remove, and airport security may also fine you.")) + "</div>";
    return html;
  }

  function renderFinish() {
    var html = "<h1>" + esc(t("Almost done")) + "</h1>";
    if (state.service === "air") html += renderDg() + '<div style="height:10px"></div>';
    html += "<h2>" + esc(t("Do you want your goods insured?")) + '</h2><div class="choices two">' +
      choice('data-ins="yes"', state.insurance === true, "", t("Yes")) + choice('data-ins="no"', state.insurance === false, "", t("No")) + "</div>";
    if (state.insurance === true) html += '<div class="note info" style="margin-top:10px">🛡️ ' + esc(t("For insurance, please contact Supun on 03 9357 7228 for more details.")) + "</div>";
    html += '<div style="height:22px"></div>';
    html += '<label class="check' + (badFields.declarationAccepted ? " bad" : "") + '"><input type="checkbox" id="declare"' + (state.declarationAccepted ? " checked" : "") + " /><span>" +
      esc(t("I declare that firearms, dangerous goods, chemicals, any prohibited items or commercial quantity of goods are not in the contents.")) + "</span></label>";
    html += '<div style="margin-top:18px">' + field("_sign", "signedName", "Type your full name to sign") + "</div>";
    html += '<div class="field"><label>' + esc(t("Signature")) + ' <span class="opt">(' + esc(t("optional")) + ')</span></label><div class="sig-wrap"><canvas id="sig"></canvas><div class="ph" id="sig-ph">' + esc(t("Sign here with your finger")) + "</div></div>" +
      '<div class="sig-actions"><span>' + esc(t("You can also sign the printed form at the counter.")) + '</span><button type="button" id="sig-clear">' + esc(t("Clear")) + "</button></div></div>";
    return html;
  }

  function renderDone() {
    var c = country();
    var boxes = c ? c.itemTypes.filter(function (it) { return state.boxes[it.key]; }).map(function (it) { return state.boxes[it.key] + " × " + it.label; }).join(", ") : "";
    return '<div class="done"><div class="big" aria-hidden="true">✓</div><h1>' + esc(t("Thank you!")) + "</h1>" +
      '<p class="lead" style="font-size:17px;color:var(--ink);font-weight:600">' + esc(t("Please show this screen to our staff.")) + "</p>" +
      '<div class="code">' + esc(result.bookingCode) + "</div>" +
      '<p class="lead">' + esc(t("We'll check your boxes with you and give you your BL number.")) + "</p>" +
      '<div class="summary"><div><b>' + esc(t("Sending to")) + "</b> " + esc(c ? t(c.label) : "") + "</div><div><b>" + esc(t("Boxes")) + "</b> " + esc(boxes) + "</div><div><b>" + esc(t("Receiver ")) + "</b> " + esc(state.receiver.fullName) + "</div></div>" +
      '<button type="button" class="btn back" id="again" style="width:100%;margin-top:22px">' + esc(t("Fill another form")) + "</button></div>";
  }

  // ---------- events ----------

  function bind() {
    main.querySelectorAll("[data-country]").forEach(function (b) {
      b.onclick = function () {
        var key = b.getAttribute("data-country");
        if (state.country !== key) { state.country = key; state.service = ""; state.boxes = {}; }
        var c = country();
        if (c && c.services.length === 1) state.service = c.services[0].key;
        errorText = ""; saveDraft(); render();
      };
    });
    main.querySelectorAll("[data-service]").forEach(function (b) {
      b.onclick = function () { state.service = b.getAttribute("data-service"); errorText = ""; saveDraft(); render(); };
    });
    main.querySelectorAll("[data-box]").forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute("data-box");
        var n = Math.max(0, Math.min(30, (state.boxes[k] || 0) + Number(b.getAttribute("data-d"))));
        if (n) state.boxes[k] = n; else delete state.boxes[k];
        errorText = ""; saveDraft(); render();
      };
    });
    main.querySelectorAll("[data-tv]").forEach(function (b) {
      b.onclick = function () {
        var i = Number(b.getAttribute("data-tv"));
        state.tvSizes[i] = b.getAttribute("data-size");
        delete badFields["tv." + i];
        saveDraft(); render();
      };
    });
    main.querySelectorAll("[data-odd]").forEach(function (input) {
      input.oninput = function () {
        var i = Number(input.getAttribute("data-odd"));
        if (!state.oddDims[i]) state.oddDims[i] = { l: "", w: "", h: "" };
        state.oddDims[i][input.getAttribute("data-dim")] = input.value;
        saveDraft();
      };
    });
    main.querySelectorAll("[data-delivery]").forEach(function (b) {
      b.onclick = function () { state.deliveryType = b.getAttribute("data-delivery"); errorText = ""; saveDraft(); render(); };
    });
    main.querySelectorAll("[data-group]").forEach(function (input) {
      input.oninput = function () {
        var g = input.getAttribute("data-group"), k = input.getAttribute("data-key");
        if (g === "_sign") state.signedName = input.value; else state[g][k] = input.value;
        if (badFields[g + "." + k]) { delete badFields[g + "." + k]; input.parentNode.classList.remove("bad"); }
        saveDraft();
      };
    });
    var signInput = main.querySelector('[data-group="_sign"]');
    if (signInput) {
      signInput.value = state.signedName || "";
      if (!state.signedName && state.sender.fullName) { signInput.value = state.sender.fullName; state.signedName = state.sender.fullName; }
    }
    var rs = document.getElementById("reuse-sender");
    if (rs) rs.onclick = function () { state.sender = Object.assign(emptyPerson(), last.sender); saveDraft(); render(); };
    var rr = document.getElementById("reuse-receiver");
    if (rr) rr.onclick = function () { state.receiver = Object.assign(emptyPerson(), last.receiver); saveDraft(); render(); };

    // Saved details (signed in to My Transco).
    var us = document.getElementById("use-saved");
    if (us) us.onclick = function () { applySaved(true); render(); };
    main.querySelectorAll("[data-saved-receiver]").forEach(function (b) {
      b.onclick = function () {
        var r = savedReceivers()[Number(b.getAttribute("data-saved-receiver"))];
        if (r) { state.receiver = Object.assign(emptyPerson(), pick(r)); badFields = {}; saveDraft(); render(); }
      };
    });
    // "Been here before?" — WhatsApp code.
    var ko = document.getElementById("known-open");
    if (ko) ko.onclick = function () {
      account.open = true;
      if (!account.phone && state.sender.mobile) account.phone = state.sender.mobile;
      render();
      var p = document.getElementById("known-phone"); if (p) p.focus();
    };
    var kc = document.getElementById("known-cc");
    if (kc) kc.onchange = function () { account.cc = kc.value; };
    var kp = document.getElementById("known-phone");
    if (kp) kp.oninput = function () { account.phone = kp.value; };
    var kcode = document.getElementById("known-code");
    if (kcode) kcode.oninput = function () { account.code = kcode.value; };
    var ks = document.getElementById("known-send");
    if (ks) ks.onclick = requestCode;
    var kv = document.getElementById("known-verify");
    if (kv) kv.onclick = verifyCode;

    main.querySelectorAll("input[data-item]").forEach(function (input) {
      input.oninput = function () {
        state.contents[Number(input.getAttribute("data-item"))][input.getAttribute("data-k")] = input.value;
        var total = document.getElementById("total");
        if (total) total.textContent = "$" + (Math.round(totalValue() * 100) / 100);
        saveDraft();
      };
    });
    main.querySelectorAll("button[data-cond]").forEach(function (b) {
      b.onclick = function () { state.contents[Number(b.getAttribute("data-item"))].condition = b.getAttribute("data-cond"); saveDraft(); render(); };
    });
    main.querySelectorAll("[data-remove]").forEach(function (b) {
      b.onclick = function () { state.contents.splice(Number(b.getAttribute("data-remove")), 1); badFields = {}; saveDraft(); render(); };
    });
    var add = document.getElementById("add-item");
    if (add) add.onclick = function () {
      state.contents.push(emptyItem()); saveDraft(); render();
      var inputs = main.querySelectorAll('input[data-k="description"]');
      if (inputs.length) inputs[inputs.length - 1].focus();
    };
    main.querySelectorAll("[data-ins]").forEach(function (b) {
      b.onclick = function () { state.insurance = b.getAttribute("data-ins") === "yes"; errorText = ""; saveDraft(); render(); };
    });
    main.querySelectorAll("[data-dgno]").forEach(function (box) {
      box.onchange = function () { state.dg.no[Number(box.getAttribute("data-dgno"))] = box.checked; saveDraft(); render(); };
    });
    var ack = document.getElementById("dg-ack");
    if (ack) ack.onchange = function () { state.dg.ack = ack.checked; delete badFields["dg.ack"]; ack.parentNode.classList.remove("bad"); saveDraft(); };
    main.querySelectorAll("[data-dgq]").forEach(function (b) {
      b.onclick = function () {
        var key = b.getAttribute("data-dgq");
        state.dg[key] = b.getAttribute("data-v") === "yes";
        errorText = ""; saveDraft(); render();
        var d = document.getElementById("dg-" + key); if (d && state.dg[key]) d.focus();
      };
    });
    main.querySelectorAll("[data-dgd]").forEach(function (input) {
      input.oninput = function () { state.dg[input.getAttribute("data-dgd") + "Details"] = input.value; input.parentNode.classList.remove("bad"); saveDraft(); };
    });
    var declare = document.getElementById("declare");
    if (declare) declare.onchange = function () { state.declarationAccepted = declare.checked; delete badFields.declarationAccepted; declare.parentNode.classList.remove("bad"); saveDraft(); };
    var sig = document.getElementById("sig");
    if (sig) setupSignature(sig);
  }

  function bindDone() {
    document.getElementById("again").onclick = function () {
      result = null; state = fresh(); step = 0; signature.drawn = false; store(DRAFT_KEY, null); render(); window.scrollTo(0, 0);
    };
  }

  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.onclick = function () { lang = b.getAttribute("data-lang"); try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} render(); };
  });

  // ---------- returning customers (My Transco sign-in) ----------

  var TOKEN_KEY = "transco_customer_token";
  var account = { signedIn: false, defaults: null, open: false, cc: "61", phone: "", code: "", sent: false, busy: false, msg: "", msgBad: false };

  function pick(p) {
    var out = {};
    ["fullName", "idNumber", "address", "town", "mobile", "homePhone", "email"].forEach(function (k) { if (p && p[k]) out[k] = p[k]; });
    return out;
  }
  function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }

  // Fills the sender from the saved details — only into an empty form,
  // unless the customer asked for it (force).
  function applySaved(force) {
    var s = account.defaults && account.defaults.sender;
    if (!s || !s.fullName) return;
    if (force || (!state.sender.fullName && !state.sender.mobile)) {
      state.sender = Object.assign(emptyPerson(), pick(s));
      badFields = {};
      saveDraft();
    }
  }

  function loadSaved(force) {
    var tk = getToken();
    if (!tk) return Promise.resolve(false);
    return fetch(API_ORIGIN + "/api/portal/booking-options", { headers: { Authorization: "Bearer " + tk } })
      .then(function (r) {
        if (r.status === 401) { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} return null; }
        return r.ok ? r.json() : null;
      })
      .then(function (d) {
        if (!d || !d.declaration) return false;
        account.signedIn = true;
        account.defaults = d.declaration;
        applySaved(force);
        render();
        return true;
      })
      .catch(function () { return false; });
  }

  function postJson(path, body) {
    return fetch(API_ORIGIN + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (data) { return { ok: res.ok, data: data }; }); });
  }

  function requestCode() {
    if (account.busy) return;
    account.busy = true; account.msg = ""; render();
    postJson("/api/portal/auth/request-code", { countryCode: account.cc, phone: account.phone })
      .then(function (r) {
        account.busy = false;
        if (r.ok) { account.sent = true; account.msg = t("Code sent — check your WhatsApp."); account.msgBad = false; }
        else { account.msg = (r.data && r.data.error) || t("Couldn't send a code. Please fill the form in yourself."); account.msgBad = true; }
        render();
        var c = document.getElementById("known-code"); if (c) c.focus();
      })
      .catch(function () { account.busy = false; account.msg = t("Couldn't send a code. Please fill the form in yourself."); account.msgBad = true; render(); });
  }

  function verifyCode() {
    if (account.busy) return;
    account.busy = true; account.msg = ""; render();
    postJson("/api/portal/auth/verify-code", { countryCode: account.cc, phone: account.phone, code: account.code, source: "warehouse_qr" })
      .then(function (r) {
        if (!r.ok || !r.data.token) {
          account.busy = false;
          account.msg = (r.data && r.data.error) || t("That code didn't work. Please try again.");
          account.msgBad = true;
          render();
          return;
        }
        try { localStorage.setItem(TOKEN_KEY, r.data.token); } catch (e) {}
        return loadSaved(true).then(function (ok) {
          account.busy = false;
          if (!ok || !(account.defaults && account.defaults.sender && account.defaults.sender.fullName)) {
            account.open = false;
            errorText = "";
            account.msg = "";
          }
          render();
        });
      })
      .catch(function () { account.busy = false; account.msg = t("That code didn't work. Please try again."); account.msgBad = true; render(); });
  }

  // ---------- signature pad ----------

  function setupSignature(canvas) {
    var ratio = Math.max(window.devicePixelRatio || 1, 1);
    var rect = canvas.getBoundingClientRect();
    var keep = signature.drawn && signature.canvas ? signature.canvas : null;
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    var ctx = canvas.getContext("2d");
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#12308a";
    if (keep) ctx.drawImage(keep, 0, 0, rect.width, rect.height);
    var ph = document.getElementById("sig-ph");
    if (ph) ph.hidden = signature.drawn;
    var drawing = false, lastPt = null;
    function pt(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    canvas.onpointerdown = function (e) { drawing = true; lastPt = pt(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(lastPt.x, lastPt.y, 1.1, 0, Math.PI * 2); ctx.fillStyle = "#12308a"; ctx.fill(); mark(); };
    canvas.onpointermove = function (e) {
      if (!drawing) return;
      var p = pt(e);
      ctx.beginPath(); ctx.moveTo(lastPt.x, lastPt.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastPt = p;
    };
    canvas.onpointerup = canvas.onpointercancel = function () { drawing = false; remember(); };
    function mark() { if (!signature.drawn) { signature.drawn = true; if (ph) ph.hidden = true; } }
    function remember() {
      var copy = document.createElement("canvas");
      copy.width = canvas.width; copy.height = canvas.height;
      copy.getContext("2d").drawImage(canvas, 0, 0);
      signature.canvas = copy;
    }
    document.getElementById("sig-clear").onclick = function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      signature.drawn = false; signature.canvas = null;
      if (ph) ph.hidden = false;
    };
  }

  // A small, cropped PNG of the drawing (transparent background), or null.
  function signaturePng() {
    if (!signature.drawn || !signature.canvas) return null;
    var src = signature.canvas;
    var data = src.getContext("2d").getImageData(0, 0, src.width, src.height).data;
    var minX = src.width, minY = src.height, maxX = -1, maxY = -1;
    for (var y = 0; y < src.height; y += 2) for (var x = 0; x < src.width; x += 2) {
      if (data[(y * src.width + x) * 4 + 3] > 10) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
    if (maxX < 0) return null;
    var pad = 8;
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(src.width, maxX + pad); maxY = Math.min(src.height, maxY + pad);
    var w = maxX - minX, h = maxY - minY;
    var scale = Math.min(1, 600 / w, 200 / h);
    var out = document.createElement("canvas");
    out.width = Math.max(1, Math.round(w * scale)); out.height = Math.max(1, Math.round(h * scale));
    out.getContext("2d").drawImage(src, minX, minY, w, h, 0, 0, out.width, out.height);
    return out.toDataURL("image/png");
  }

  // ---------- checks per step ----------

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function phoneOk(v) { var d = String(v || "").replace(/\D/g, ""); return /^\+?[\d\s()-]+$/.test(String(v || "").trim()) && d.length >= 7 && d.length <= 15; }

  function checkPerson(group, withTown, idRequired) {
    var p = state[group], bad = {};
    if (String(p.fullName).trim().length < 2) bad[group + ".fullName"] = 1;
    if (idRequired && !/^[A-Za-z0-9]{5,20}$/.test(String(p.idNumber).replace(/\s/g, ""))) bad[group + ".idNumber"] = 1;
    if (!idRequired && p.idNumber && !/^[A-Za-z0-9]{5,20}$/.test(String(p.idNumber).replace(/\s/g, ""))) bad[group + ".idNumber"] = 1;
    if (String(p.address).trim().length < 5) bad[group + ".address"] = 1;
    if (withTown && String(p.town).trim().length < 2) bad[group + ".town"] = 1;
    if (!phoneOk(p.mobile)) bad[group + ".mobile"] = 1;
    if (p.homePhone && !phoneOk(p.homePhone)) bad[group + ".homePhone"] = 1;
    if (!EMAIL_RE.test(String(p.email).trim())) bad[group + ".email"] = 1;
    return bad;
  }

  function validDim(v) { var n = Number(v); return v != null && String(v).trim() !== "" && isFinite(n) && n >= 1 && n <= 500; }

  // Items to send: TVs carry their screen sizes, odd-size items their L × W × H.
  function itemsPayload() {
    var c = country();
    return c.itemTypes.filter(function (it) { return state.boxes[it.key]; }).map(function (it) {
      var qty = state.boxes[it.key], item = { type: it.key, qty: qty };
      if (it.key === "tv") item.sizes = state.tvSizes.slice(0, qty);
      if (it.key === "other") item.dims = state.oddDims.slice(0, qty).map(function (d) { return { l: Number(d.l), w: Number(d.w), h: Number(d.h) }; });
      return item;
    });
  }

  function check(stepName) {
    badFields = {};
    if (stepName === "where") {
      if (!country()) return t("Please choose where you are sending to.");
      if (!state.service) return t("Please choose Sea or Air freight.");
    }
    if (stepName === "boxes") {
      if (!Object.keys(state.boxes).length) return t("Please add at least one box.");
      for (var ti = 0; ti < (state.boxes.tv || 0); ti++) {
        if (!validTvSize(state.tvSizes[ti])) badFields["tv." + ti] = 1;
      }
      if (Object.keys(badFields).length) return t("Please choose each TV's screen size.");
      for (var oi = 0; oi < (state.boxes.other || 0); oi++) {
        var d = state.oddDims[oi] || {};
        if (!validDim(d.l) || !validDim(d.w) || !validDim(d.h)) badFields["odd." + oi] = 1;
      }
      if (Object.keys(badFields).length) return t("Please enter the length, width and height of each odd-size item in cm (1–500).");
      if (!state.deliveryType) return t("Please choose pickup or door delivery.");
    }
    if (stepName === "sender" || stepName === "receiver") {
      badFields = stepName === "sender" ? checkPerson("sender", false, state.country === "sri_lanka") : checkPerson("receiver", true, true);
      var keys = Object.keys(badFields);
      if (keys.length === 1 && /\.email$/.test(keys[0])) return t("Please check the email address.");
      if (keys.length === 1 && /\.mobile$/.test(keys[0])) return t("Please check the mobile number.");
      if (keys.length) return t("Please fill in the boxes marked in red.");
    }
    if (stepName === "contents") {
      state.contents.forEach(function (c, i) {
        var q = Number(c.qty);
        if (String(c.description).trim().length < 2 || !c.condition || !(Number.isInteger(q) && q >= 1 && q <= 999)) badFields["contents." + i] = 1;
      });
      if (Object.keys(badFields).length) return t("Please describe each item, its number and value.");
    }
    if (stepName === "finish") {
      if (state.service === "air") {
        var dg = state.dg;
        if (!dg.no.every(Boolean) && !dg.ack) { badFields["dg.ack"] = 1; return t("Please tick the lines that are not in your boxes, or confirm the ones that may be."); }
        if (dg.medications === null || dg.lithium === null || dg.liquids === null) return t("Please answer each Air Freight question.");
        if (dg.lithium && String(dg.lithiumDetails).trim().length < 2) { badFields["dg.lithiumDetails"] = 1; return t("Please write the type of product and quantity."); }
        if (dg.liquids && String(dg.liquidsDetails).trim().length < 2) { badFields["dg.liquidsDetails"] = 1; return t("Please write the type of product and quantity."); }
      }
      if (state.insurance === null) return t("Please answer the insurance question.");
      if (!state.declarationAccepted) { badFields.declarationAccepted = 1; return t("Please tick the declaration."); }
      if (String(state.signedName).trim().length < 2) { badFields["_sign.signedName"] = 1; return t("Please type your full name to sign."); }
    }
    return "";
  }

  // Server field → the step it lives on.
  function stepForField(f) {
    if (!f) return step;
    if (f === "country" || f === "service") return 0;
    if (f === "items" || f === "deliveryType") return 1;
    if (f.indexOf("sender.") === 0) return 2;
    if (f.indexOf("receiver.") === 0) return 3;
    if (f === "contents") return 4;
    return 5;
  }

  function submit() {
    var c = country();
    var body = {
      country: state.country,
      service: state.service,
      items: itemsPayload(),
      deliveryType: state.deliveryType,
      sender: state.sender,
      receiver: state.receiver,
      contents: state.contents.map(function (x) { return { description: x.description, condition: x.condition, qty: Number(x.qty) }; }),
      insurance: state.insurance,
      declarationAccepted: state.declarationAccepted,
      signedName: state.signedName,
      signatureImage: signaturePng()
    };
    if (state.service === "air") {
      body.dangerousGoods = {
        notInBoxes: state.dg.no.slice(),
        prohibitedAcknowledged: !state.dg.no.every(Boolean) && !!state.dg.ack,
        medications: state.dg.medications, lithium: state.dg.lithium, lithiumDetails: state.dg.lithiumDetails,
        liquids: state.dg.liquids, liquidsDetails: state.dg.liquidsDetails
      };
    }
    sending = true; errorText = ""; render();
    fetch(API_ORIGIN + "/api/public/dropoff", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        sending = false;
        if (!r.ok) {
          errorText = (r.data && r.data.error) || t("Couldn't send. Please check your internet and try again, or ask our staff.");
          if (r.data && r.data.field) { badFields = {}; badFields[r.data.field] = 1; step = stepForField(r.data.field); }
          render(); window.scrollTo(0, 0);
          return;
        }
        result = r.data;
        // Remembered on THIS phone only, for next time.
        store(LAST_KEY, { country: state.country, sender: state.sender, receiver: state.receiver });
        last = store(LAST_KEY);
        store(DRAFT_KEY, null);
        render(); window.scrollTo(0, 0);
      })
      .catch(function () {
        sending = false;
        errorText = t("Couldn't send. Please check your internet and try again, or ask our staff.");
        render();
      });
  }

  nextBtn.onclick = function () {
    if (sending) return;
    var problem = check(STEPS[step]);
    if (problem) { errorText = problem; render(); window.scrollTo(0, 0); return; }
    errorText = "";
    if (step === STEPS.length - 1) return submit();
    step += 1; render(); window.scrollTo(0, 0);
  };
  backBtn.onclick = function () { if (step > 0) { step -= 1; errorText = ""; badFields = {}; render(); window.scrollTo(0, 0); } };

  // Box types come from the backend (same lists as online booking).
  fetch(API_ORIGIN + "/api/public/dropoff/options")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) { if (data && data.countries && data.countries.length) { options = data; render(); } })
    .catch(function () {});

  // Already signed in to My Transco on this phone → saved details ready.
  loadSaved(false);

  render();
})();
</script>
</body>
</html>
